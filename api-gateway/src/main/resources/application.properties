spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway Routes

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# Auth Service
spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**

# Interview Service
spring.cloud.gateway.server.webflux.routes[2].id=interview-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://INTERVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/interviews/**

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG

jwt.secret=MyVerySecretKeyForInterviewPortalProject123456789